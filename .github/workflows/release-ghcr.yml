name: release-ghcr

on:
  push:
    # Trigger only on semantic version tag pushes like v1.2.3
    tags:
      - 'v*.*.*'

jobs:
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            platform_id: amd64
            runner: ubuntu-latest
            setup_qemu: false
          - platform: linux/arm64
            platform_id: arm64
            runner: ubuntu-24.04-arm
            setup_qemu: false
          - platform: linux/arm/v7
            platform_id: armv7
            runner: ubuntu-24.04-arm
            setup_qemu: true
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Validate semantic tag
        id: semver
        env:
          # For tag push events the tag name is available as github.ref_name
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "This workflow only publishes for semantic tags: vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up QEMU
        if: matrix.setup_qemu
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.semver.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.platform_id }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - docker
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate semantic tag
        id: semver
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "This workflow only publishes for semantic tags: vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v6
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            $(printf '%s@sha256:%s ' "${IMAGE}" $(ls "${{ runner.temp }}/digests"))
